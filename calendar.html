<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACRAFT 月間カレンダー タスク管理</title>
<style>
  :root {
    --main: #6F7563;
    --main-dark: #5a5f4f;
    --bg: #F4F0E6;
    --text: #2F3430;
    --card-bg: #ffffff;
    --border: #d8d3c4;
    --overdue: #b3452f;
    --overdue-bg: #f7e2dc;
    --selected-bg: #e4e0cf;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 20px;
  }
  h1 {
    font-size: 1.35rem;
    margin: 0 0 10px;
    color: var(--main-dark);
  }
  .overdue-summary {
    display: inline-block;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 4px 14px;
    border-radius: 999px;
    margin-bottom: 16px;
    background: #e9e6da;
    color: #6a6a60;
  }
  .overdue-summary.alert {
    background: var(--overdue-bg);
    color: var(--overdue);
  }
  .assignee-summary {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
    font-size: 0.85rem;
    margin-bottom: 12px;
    color: var(--text);
  }
  .assignee-summary .summary-item {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .assignee-summary .summary-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .assignee-summary .summary-sep {
    color: #9a9488;
    margin: 0 2px;
  }
  .assignee-summary .summary-empty {
    color: #8a8a80;
  }
  h2 {
    font-size: 1rem;
    margin: 0 0 12px;
    color: var(--main-dark);
  }
  .container {
    max-width: 760px;
    margin: 0 auto;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 20px;
  }

  /* ---- Calendar header / nav ---- */
  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .cal-nav .month-label {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--main-dark);
  }
  .cal-nav-buttons {
    display: flex;
    gap: 6px;
  }
  .nav-btn {
    background: var(--main);
    color: #fff;
    border: none;
    border-radius: 6px;
    width: 32px;
    height: 32px;
    font-size: 1rem;
    cursor: pointer;
  }
  .nav-btn:hover { background: var(--main-dark); }
  .today-btn {
    background: transparent;
    border: 1px solid var(--main);
    color: var(--main-dark);
    border-radius: 6px;
    padding: 0 10px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .today-btn:hover { background: #e9e6da; }

  /* ---- Calendar grid ---- */
  .calendar-weekdays, .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .calendar-weekdays {
    margin-bottom: 4px;
  }
  .weekday-cell {
    text-align: center;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--main-dark);
    padding: 4px 0;
  }
  .weekday-cell.sun { color: var(--overdue); }

  .day-cell {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px;
    min-height: 54px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: flex-start;
    cursor: pointer;
    position: relative;
  }
  .day-cell:hover { border-color: var(--main); }
  .day-cell.other-month { opacity: 0.4; }
  .day-cell.today { border: 2px solid var(--main); }
  .day-cell.selected-week { background: var(--selected-bg); }
  .day-num {
    font-size: 0.78rem;
    font-weight: 600;
  }
  .day-num.overdue-text { color: var(--overdue); font-weight: 700; }
  .day-badge {
    align-self: flex-end;
    min-width: 17px;
    height: 17px;
    border-radius: 999px;
    background: var(--main);
    color: #fff;
    font-size: 0.62rem;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
  }
  .day-badge.overdue { background: var(--overdue); }

  .legend {
    margin-top: 10px;
    font-size: 0.78rem;
    color: #6a6a60;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
  }
  .legend .swatch {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 999px;
    margin-right: 4px;
    vertical-align: middle;
  }
  .legend .swatch.normal { background: var(--main); }
  .legend .swatch.overdue { background: var(--overdue); }

  @media (max-width: 480px) {
    .day-cell { min-height: 42px; padding: 3px; }
    .day-num { font-size: 0.7rem; }
    .weekday-cell { font-size: 0.68rem; }
  }

  /* ---- Week list ---- */
  .week-range {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--main-dark);
    margin-bottom: 12px;
  }

  /* ---- Project accordion ---- */
  .project-accordion {
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .project-accordion.has-overdue { border-color: var(--overdue); }
  .project-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 12px;
    background: #e9e6da;
  }
  .project-toggle {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 8px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    padding: 0;
    text-align: left;
    flex: 1 1 auto;
    min-width: 140px;
  }
  .project-toggle .chevron {
    color: var(--main-dark);
    font-size: 0.7rem;
    flex-shrink: 0;
    width: 12px;
  }
  .project-toggle .project-name {
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--main-dark);
    word-break: break-word;
  }
  .project-toggle .project-due {
    font-size: 0.75rem;
    color: #6a6a60;
    white-space: nowrap;
  }
  .project-badges {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    flex: 1 1 auto;
  }

  @media (max-width: 480px) {
    .project-header { flex-direction: column; align-items: stretch; }
    .project-toggle { min-width: 0; }
  }
  .badge-count, .badge-incomplete {
    font-size: 0.72rem;
    padding: 2px 9px;
    border-radius: 999px;
    background: #ddd8c8;
    color: #4a4a3f;
    white-space: nowrap;
  }
  .badge-overdue {
    font-size: 0.72rem;
    padding: 2px 9px;
    border-radius: 999px;
    background: var(--overdue-bg);
    color: var(--overdue);
    font-weight: 700;
    white-space: nowrap;
  }
  .project-badges .icon-btn-edit,
  .project-badges .icon-btn-delete {
    padding: 3px 9px;
    font-size: 0.7rem;
  }
  .project-body {
    padding: 10px 12px;
    background: var(--card-bg);
  }
  .project-body .empty-state.small {
    padding: 12px;
    font-size: 0.82rem;
  }

  .task-card {
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 10px;
  }
  .task-card:last-child { margin-bottom: 0; }
  .task-card.overdue {
    background: var(--overdue-bg);
    border-color: var(--overdue);
  }
  .task-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }
  .task-main {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .assignee-chip {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    font-weight: 700;
  }
  .task-info { min-width: 0; }
  .task-name {
    font-size: 0.92rem;
    font-weight: 700;
    word-break: break-word;
  }
  .task-meta {
    font-size: 0.78rem;
    color: #6a6a60;
  }
  .task-meta .due-text.overdue-text { color: var(--overdue); font-weight: 700; }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .progress-bar {
    flex: 1;
    height: 8px;
    background: #e9e6da;
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--main);
    border-radius: 999px;
  }
  .task-card.overdue .progress-bar { background: #ecd4c9; }
  .progress-text {
    font-size: 0.72rem;
    color: #6a6a60;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .task-actions-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .progress-buttons {
    display: flex;
    gap: 6px;
  }
  .progress-buttons button {
    padding: 5px 10px;
    font-size: 0.75rem;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  .icon-btn-inc { background: var(--main); color: #fff; }
  .icon-btn-inc:hover:not(:disabled) { background: var(--main-dark); }
  .icon-btn-dec { background: #e9e6da; color: var(--text); }
  .progress-buttons button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .status-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.75rem;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .status-未着手 { background: #ddd8c8; color: #4a4a3f; }
  .status-進行中 { background: #e2c98a; color: #5c4a12; }
  .status-完了 { background: #b9c6ad; color: #34432b; }
  .row-actions {
    display: flex;
    gap: 6px;
  }
  .row-actions button, .project-badges button {
    padding: 5px 10px;
    font-size: 0.75rem;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
  }
  .icon-btn-edit { background: #dcd8ca; color: var(--text); }
  .icon-btn-delete { background: var(--overdue-bg); color: var(--overdue); }

  .empty-state {
    text-align: center;
    padding: 30px;
    color: #7a7a70;
  }

  .form-hint {
    font-size: 0.82rem;
    color: var(--overdue);
    margin: 0 0 10px;
  }

  /* ---- Form ---- */
  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    align-items: end;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }
  .field label {
    font-size: 0.78rem;
    color: var(--text);
    opacity: 0.75;
  }
  input, select {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.9rem;
    background: #fff;
    color: var(--text);
    font-family: inherit;
    width: 100%;
    min-width: 0;
  }
  input:disabled, select:disabled {
    background: #ecebe4;
    color: #9a9488;
  }
  input:focus, select:focus {
    outline: 2px solid var(--main);
    outline-offset: 1px;
  }
  .form-actions {
    grid-column: 1 / -1;
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  button { font-family: inherit; }
  .btn-primary {
    background: var(--main);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .btn-primary:hover:not(:disabled) { background: var(--main-dark); }
  .btn-primary:disabled { background: #cfcabb; color: #8a8a80; cursor: not-allowed; }
  .btn-secondary {
    background: transparent;
    color: var(--main-dark);
    border: 1px solid var(--main);
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .btn-secondary:hover { background: #e9e6da; }

  @media (max-width: 400px) {
    .form-grid { grid-template-columns: 1fr; }
  }

  .passcode-overlay {
    position: fixed;
    inset: 0;
    background: rgba(47, 52, 48, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .passcode-box {
    background: var(--card-bg);
    border-radius: 10px;
    padding: 24px;
    max-width: 320px;
    width: 100%;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25);
  }
  .passcode-box h2 {
    margin: 0 0 8px;
    font-size: 1.05rem;
    color: var(--main-dark);
  }
  .passcode-box p {
    font-size: 0.85rem;
    color: #6a6a60;
    margin: 0 0 14px;
  }
  .passcode-box input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .passcode-box .error-msg {
    color: var(--overdue);
    font-size: 0.82rem;
    margin: -4px 0 10px;
    display: none;
  }
  .passcode-box button {
    width: 100%;
    padding: 10px;
  }
  .passcode-box button:disabled {
    background: #cfcabb;
    cursor: not-allowed;
  }
  .error-state { color: var(--overdue); }
</style>
</head>
<body>
<div class="passcode-overlay" id="passcode-overlay" style="display:none;">
  <div class="passcode-box">
    <h2>パスコードを入力</h2>
    <p>共通パスコードを入力してください。</p>
    <form id="passcode-form">
      <input type="password" id="passcode-input" placeholder="パスコード" autocomplete="off" required>
      <div class="error-msg" id="passcode-error">パスコードが違います。</div>
      <button type="submit" class="btn-primary" id="passcode-submit">開く</button>
    </form>
  </div>
</div>
<div class="container">
  <h1>ACRAFT 月間カレンダー タスク管理</h1>
  <div class="overdue-summary" id="overdue-summary">締切超過: 0件</div>

  <div class="card">
    <div class="cal-nav">
      <div class="cal-nav-buttons">
        <button class="nav-btn" id="prev-month" aria-label="前の月">&#9664;</button>
        <button class="nav-btn" id="next-month" aria-label="次の月">&#9654;</button>
        <button class="today-btn" id="today-btn">今日</button>
      </div>
      <div class="month-label" id="month-label"></div>
    </div>

    <div class="calendar-weekdays">
      <div class="weekday-cell">月</div>
      <div class="weekday-cell">火</div>
      <div class="weekday-cell">水</div>
      <div class="weekday-cell">木</div>
      <div class="weekday-cell">金</div>
      <div class="weekday-cell">土</div>
      <div class="weekday-cell sun">日</div>
    </div>
    <div class="calendar-grid" id="calendar-grid"></div>

    <div class="legend">
      <span><span class="swatch normal"></span>締切のあるタスク件数</span>
      <span><span class="swatch overdue"></span>締切超過(未完了)</span>
    </div>
  </div>

  <div class="card">
    <div class="assignee-summary" id="assignee-summary"></div>
    <div class="week-range" id="week-range"></div>
    <div id="week-list"></div>
  </div>

  <div class="card">
    <h2 id="project-form-title">プロジェクトを追加</h2>
    <form id="project-form">
      <input type="hidden" id="project-id">
      <div class="form-grid">
        <div class="field">
          <label for="project-name">プロジェクト名</label>
          <input type="text" id="project-name" required placeholder="例: 銀座納品">
        </div>
        <div class="field">
          <label for="project-due">締切日(全体・任意)</label>
          <input type="date" id="project-due">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="project-submit-btn">プロジェクトを追加</button>
          <button type="button" class="btn-secondary" id="project-cancel-edit" style="display:none;">キャンセル</button>
        </div>
      </div>
    </form>
  </div>

  <div class="card">
    <h2 id="task-form-title">タスクを追加</h2>
    <p class="form-hint" id="task-form-hint" style="display:none;">先にプロジェクトを追加してください。</p>
    <form id="task-form">
      <input type="hidden" id="task-id">
      <div class="form-grid">
        <div class="field">
          <label for="task-project-select">プロジェクト</label>
          <select id="task-project-select" required></select>
        </div>
        <div class="field">
          <label for="task-name">タスク名</label>
          <input type="text" id="task-name" required placeholder="例: 梱包">
        </div>
        <div class="field">
          <label for="assignee">担当者</label>
          <input type="text" id="assignee" required placeholder="例: 山田">
        </div>
        <div class="field">
          <label for="due">締切日</label>
          <input type="date" id="due" required>
        </div>
        <div class="field">
          <label for="total-count">全体数</label>
          <input type="number" id="total-count" min="1" step="1" value="1" required>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="submit-btn">追加</button>
          <button type="button" class="btn-secondary" id="cancel-edit" style="display:none;">キャンセル</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://timytwkdfmchzojvzjzq.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_QrhqeSQYfQbljjGyWIjx2A_rq7wFU5-';
  const PASSCODE_STORAGE_KEY = 'acraft-passcode';
  const OLD_LOCAL_KEY = 'acraft-calendar-tasks';
  const LOCAL_MIGRATION_FLAG = 'acraft-calendar-migrated';
  const WEEKDAY_JP = ['日', '月', '火', '水', '木', '金', '土'];

  let sb = null;

  function getStoredPasscode() {
    try { return localStorage.getItem(PASSCODE_STORAGE_KEY) || ''; }
    catch (e) { return ''; }
  }
  function storePasscode(pc) {
    try { localStorage.setItem(PASSCODE_STORAGE_KEY, pc); } catch (e) {}
  }
  function clearStoredPasscode() {
    try { localStorage.removeItem(PASSCODE_STORAGE_KEY); } catch (e) {}
  }

  function createSupabaseClient(passcode) {
    return window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      global: { headers: { 'x-app-passcode': passcode } }
    });
  }

  async function verifyPasscode(passcode) {
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const { data, error } = await client.rpc('check_passcode', { input_passcode: passcode });
    if (error) return false;
    return data === true;
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function pad2(n) {
    return String(n).padStart(2, '0');
  }

  function formatYMD(date) {
    return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
  }

  function parseYMD(str) {
    const [y, m, d] = str.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function addDays(date, n) {
    const d = new Date(date);
    d.setDate(d.getDate() + n);
    return d;
  }

  function startOfWeek(date) {
    const d = new Date(date);
    const diffFromMonday = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - diffFromMonday);
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function hashCode(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
      hash = str.charCodeAt(i) + ((hash << 5) - hash);
      hash |= 0;
    }
    return hash;
  }

  function assigneeColor(name) {
    const hue = Math.abs(hashCode(name)) % 360;
    return `hsl(${hue}, 42%, 40%)`;
  }

  function computeStatus(done, total) {
    if (done <= 0) return '未着手';
    if (done >= total) return '完了';
    return '進行中';
  }

  function normalizeTaskCounts(t) {
    const total = (typeof t.total === 'number' && t.total > 0) ? Math.floor(t.total) : 1;
    let done = (typeof t.done === 'number') ? t.done : (t.status === '完了' ? total : 0);
    done = Math.max(0, Math.min(Math.floor(done), total));
    return {
      id: t.id || uid(),
      name: t.name || t.project || '(無題タスク)',
      assignee: t.assignee || '',
      due: t.due || '',
      total,
      done,
      status: t.status || computeStatus(done, total)
    };
  }

  // Parses old localStorage data (either the pre-project flat task
  // array, or the later local nested-project format) into the same
  // { id, name, dueDate, tasks[] } shape used everywhere else.
  function parseLocalProjectsData(data) {
    if (!Array.isArray(data) || data.length === 0) return [];
    const isOldFlatFormat = !Array.isArray(data[0].tasks);

    if (isOldFlatFormat) {
      return data.map(old => ({
        id: uid(),
        name: old.project || old.name || '(無題プロジェクト)',
        dueDate: old.due || '',
        tasks: [normalizeTaskCounts(old)]
      }));
    }

    return data.map(p => ({
      id: p.id || uid(),
      name: p.name || '(無題プロジェクト)',
      dueDate: p.dueDate || '',
      tasks: Array.isArray(p.tasks) ? p.tasks.map(normalizeTaskCounts) : []
    }));
  }

  // One-time upload of any pre-Supabase localStorage data into the
  // cloud tables, so switching to the cloud doesn't lose existing work.
  async function migrateLocalDataIfNeeded() {
    try {
      if (localStorage.getItem(LOCAL_MIGRATION_FLAG) === 'true') return;
      const raw = localStorage.getItem(OLD_LOCAL_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        const localProjects = parseLocalProjectsData(data);
        if (localProjects.length > 0) {
          const projectRows = localProjects.map(p => ({
            id: p.id, name: p.name, due_date: p.dueDate || null
          }));
          const { error: pErr } = await sb.from('calendar_projects').upsert(projectRows, { onConflict: 'id' });
          if (pErr) console.error('Project migration failed', pErr);

          const taskRows = localProjects.flatMap(p => p.tasks.map(t => ({
            id: t.id, project_id: p.id, name: t.name, assignee: t.assignee,
            due: t.due, status: t.status, total: t.total, done: t.done
          })));
          if (taskRows.length > 0) {
            const { error: tErr } = await sb.from('calendar_tasks').upsert(taskRows, { onConflict: 'id' });
            if (tErr) console.error('Task migration failed', tErr);
          }
        }
      }
      localStorage.setItem(LOCAL_MIGRATION_FLAG, 'true');
    } catch (e) {
      console.error('Migration error', e);
    }
  }

  async function fetchProjects() {
    const [projectsRes, tasksRes] = await Promise.all([
      sb.from('calendar_projects').select('*').order('due_date', { ascending: true, nullsFirst: false }),
      sb.from('calendar_tasks').select('*').order('due', { ascending: true })
    ]);
    if (projectsRes.error || tasksRes.error) {
      console.error(projectsRes.error || tasksRes.error);
      weekListEl.innerHTML = '<div class="empty-state error-state">データの読み込みに失敗しました。通信状況を確認して再読み込みしてください。</div>';
      return [];
    }
    return projectsRes.data.map(p => ({
      id: p.id,
      name: p.name,
      dueDate: p.due_date || '',
      tasks: tasksRes.data
        .filter(t => t.project_id === p.id)
        .map(t => ({
          id: t.id, name: t.name, assignee: t.assignee, due: t.due,
          status: t.status, total: t.total, done: t.done
        }))
    }));
  }

  async function boot() {
    weekListEl.innerHTML = '<div class="empty-state">読み込み中...</div>';
    await migrateLocalDataIfNeeded();
    projects = await fetchProjects();
    renderAll();
  }

  function allTaskEntries() {
    const result = [];
    projects.forEach(p => {
      p.tasks.forEach(t => result.push({ project: p, task: t }));
    });
    return result;
  }

  function isOverdue(task) {
    return task.status !== '完了' && task.due < todayStr;
  }

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const todayStr = formatYMD(today);

  let projects = [];

  let editingTaskRef = null;
  let editingProjectId = null;
  let displayYear = today.getFullYear();
  let displayMonth = today.getMonth();
  let selectedWeekStart = startOfWeek(today);
  const projectOpenState = {};

  const calendarGrid = document.getElementById('calendar-grid');
  const monthLabel = document.getElementById('month-label');
  const weekRangeEl = document.getElementById('week-range');
  const weekListEl = document.getElementById('week-list');
  const assigneeSummaryEl = document.getElementById('assignee-summary');
  const overdueSummaryEl = document.getElementById('overdue-summary');
  const passcodeOverlay = document.getElementById('passcode-overlay');
  const passcodeForm = document.getElementById('passcode-form');
  const passcodeInput = document.getElementById('passcode-input');
  const passcodeError = document.getElementById('passcode-error');
  const passcodeSubmitBtn = document.getElementById('passcode-submit');

  const projectForm = document.getElementById('project-form');
  const projectFormTitle = document.getElementById('project-form-title');
  const projectSubmitBtn = document.getElementById('project-submit-btn');
  const projectCancelEditBtn = document.getElementById('project-cancel-edit');

  const taskForm = document.getElementById('task-form');
  const taskFormTitle = document.getElementById('task-form-title');
  const taskFormHint = document.getElementById('task-form-hint');
  const taskProjectSelect = document.getElementById('task-project-select');
  const submitBtn = document.getElementById('submit-btn');
  const cancelEditBtn = document.getElementById('cancel-edit');

  function updateOverdueSummary() {
    const count = allTaskEntries().filter(({ task }) => isOverdue(task)).length;
    overdueSummaryEl.textContent = `締切超過: ${count}件`;
    overdueSummaryEl.classList.toggle('alert', count > 0);
  }

  function updateAssigneeSummary(weekTasks) {
    const activeTasks = weekTasks.filter(t => t.status !== '完了');
    const counts = {};
    activeTasks.forEach(t => {
      counts[t.assignee] = (counts[t.assignee] || 0) + 1;
    });
    const names = Object.keys(counts).sort((a, b) => a.localeCompare(b, 'ja'));

    if (names.length === 0) {
      assigneeSummaryEl.innerHTML = '<span class="summary-empty">未完了タスクはありません</span>';
      return;
    }

    assigneeSummaryEl.innerHTML = names.map(name => `
      <span class="summary-item">
        <span class="summary-dot" style="background:${assigneeColor(name)}"></span>${escapeHtml(name)} ${counts[name]}件
      </span>`).join('<span class="summary-sep">・</span>');
  }

  function updateProjectSelectOptions() {
    const current = taskProjectSelect.value;
    taskProjectSelect.innerHTML = projects
      .map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`)
      .join('');
    if (projects.some(p => p.id === current)) taskProjectSelect.value = current;

    const hasProjects = projects.length > 0;
    taskFormHint.style.display = hasProjects ? 'none' : 'block';
    ['task-project-select', 'task-name', 'assignee', 'due', 'total-count'].forEach(id => {
      document.getElementById(id).disabled = !hasProjects;
    });
    submitBtn.disabled = !hasProjects;
  }

  function renderCalendar() {
    monthLabel.textContent = `${displayYear}年${displayMonth + 1}月`;

    const firstOfMonth = new Date(displayYear, displayMonth, 1);
    const gridStart = startOfWeek(firstOfMonth);
    const selectedWeekEnd = addDays(selectedWeekStart, 6);
    const flatTasks = allTaskEntries().map(e => e.task);

    let html = '';
    for (let i = 0; i < 42; i++) {
      const cellDate = addDays(gridStart, i);
      const cellStr = formatYMD(cellDate);
      const isOtherMonth = cellDate.getMonth() !== displayMonth;
      const isToday = cellStr === todayStr;
      const isSelectedWeek = cellDate >= selectedWeekStart && cellDate <= selectedWeekEnd;

      const dayTasks = flatTasks.filter(t => t.due === cellStr);
      const hasOverdue = cellStr < todayStr && dayTasks.some(t => t.status !== '完了');

      const classes = ['day-cell'];
      if (isOtherMonth) classes.push('other-month');
      if (isToday) classes.push('today');
      if (isSelectedWeek) classes.push('selected-week');

      const numClasses = ['day-num'];
      if (hasOverdue) numClasses.push('overdue-text');

      let badgeHtml = '';
      if (dayTasks.length > 0) {
        badgeHtml = `<span class="day-badge ${hasOverdue ? 'overdue' : ''}">${dayTasks.length}</span>`;
      }

      html += `
        <div class="${classes.join(' ')}" data-date="${cellStr}">
          <span class="${numClasses.join(' ')}">${cellDate.getDate()}</span>
          ${badgeHtml}
        </div>`;
    }
    calendarGrid.innerHTML = html;
  }

  function taskCardHtml(project, task) {
    const overdue = isOverdue(task);
    const d = parseYMD(task.due);
    const dueLabel = `${d.getMonth() + 1}/${d.getDate()}(${WEEKDAY_JP[d.getDay()]})`;
    const initial = task.assignee.trim().charAt(0) || '?';
    const pct = Math.round((task.done / task.total) * 100);

    return `
      <div class="task-card ${overdue ? 'overdue' : ''}">
        <div class="task-top">
          <div class="task-main">
            <span class="assignee-chip" style="background:${assigneeColor(task.assignee)}">${escapeHtml(initial)}</span>
            <div class="task-info">
              <div class="task-name">${escapeHtml(task.name)}</div>
              <div class="task-meta">
                担当: ${escapeHtml(task.assignee)} ・
                <span class="due-text ${overdue ? 'overdue-text' : ''}">${dueLabel}${overdue ? '（超過）' : ''}</span>
              </div>
            </div>
          </div>
          <span class="status-badge status-${task.status}">${task.status}</span>
        </div>
        <div class="progress-row">
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
          <span class="progress-text">${task.done}/${task.total}完了</span>
        </div>
        <div class="task-actions-row">
          <div class="progress-buttons">
            <button class="icon-btn-dec" data-action="dec" data-project-id="${project.id}" data-task-id="${task.id}" ${task.done <= 0 ? 'disabled' : ''}>-1</button>
            <button class="icon-btn-inc" data-action="inc" data-project-id="${project.id}" data-task-id="${task.id}" ${task.done >= task.total ? 'disabled' : ''}>+1完了</button>
          </div>
          <div class="row-actions">
            <button class="icon-btn-edit" data-action="edit-task" data-project-id="${project.id}" data-task-id="${task.id}">編集</button>
            <button class="icon-btn-delete" data-action="delete-task" data-project-id="${project.id}" data-task-id="${task.id}">削除</button>
          </div>
        </div>
      </div>`;
  }

  function projectAccordionHtml(p) {
    const hasOverdueAny = p.tasks.some(isOverdue);
    const incompleteCount = p.tasks.filter(t => t.status !== '完了').length;

    if (!(p.id in projectOpenState)) {
      projectOpenState[p.id] = hasOverdueAny;
    }
    const isOpen = projectOpenState[p.id];

    const sortedTasks = [...p.tasks].sort((a, b) => a.due.localeCompare(b.due));
    let dueLabel = '';
    if (p.dueDate) {
      const d = parseYMD(p.dueDate);
      dueLabel = `${d.getMonth() + 1}/${d.getDate()}`;
    }

    const bodyHtml = sortedTasks.length === 0
      ? '<div class="empty-state small">タスクがありません</div>'
      : sortedTasks.map(t => taskCardHtml(p, t)).join('');

    return `
      <div class="project-accordion ${hasOverdueAny ? 'has-overdue' : ''}">
        <div class="project-header">
          <button type="button" class="project-toggle" data-action="toggle-project" data-project-id="${p.id}">
            <span class="chevron">${isOpen ? '▼' : '▶'}</span>
            <span class="project-name">${escapeHtml(p.name)}</span>
            ${dueLabel ? `<span class="project-due">締切: ${dueLabel}</span>` : ''}
          </button>
          <div class="project-badges">
            <span class="badge-count">${p.tasks.length}件</span>
            <span class="badge-incomplete">未完了 ${incompleteCount}</span>
            ${hasOverdueAny ? '<span class="badge-overdue">超過あり</span>' : ''}
            <button type="button" class="icon-btn-edit" data-action="edit-project" data-project-id="${p.id}">編集</button>
            <button type="button" class="icon-btn-delete" data-action="delete-project" data-project-id="${p.id}">削除</button>
          </div>
        </div>
        <div class="project-body" ${isOpen ? '' : 'style="display:none"'}>
          ${bodyHtml}
        </div>
      </div>`;
  }

  function renderWeekList() {
    const weekEnd = addDays(selectedWeekStart, 6);
    const weekStartStr = formatYMD(selectedWeekStart);
    const weekEndStr = formatYMD(weekEnd);

    weekRangeEl.textContent =
      `${selectedWeekStart.getMonth() + 1}/${selectedWeekStart.getDate()}〜` +
      `${weekEnd.getMonth() + 1}/${weekEnd.getDate()}の週`;

    const weekEntries = allTaskEntries().filter(
      ({ task }) => task.due >= weekStartStr && task.due <= weekEndStr
    );

    updateAssigneeSummary(weekEntries.map(e => e.task));

    if (weekEntries.length === 0) {
      weekListEl.innerHTML = '<div class="empty-state">この週に締切のタスクはありません。</div>';
      return;
    }

    const projectMinDue = new Map();
    weekEntries.forEach(({ project, task }) => {
      const cur = projectMinDue.get(project.id);
      if (!cur || task.due < cur) projectMinDue.set(project.id, task.due);
    });

    const relevantProjects = projects
      .filter(p => projectMinDue.has(p.id))
      .sort((a, b) => projectMinDue.get(a.id).localeCompare(projectMinDue.get(b.id)));

    weekListEl.innerHTML = relevantProjects.map(p => projectAccordionHtml(p)).join('');
  }

  function renderAll() {
    updateOverdueSummary();
    updateProjectSelectOptions();
    renderCalendar();
    renderWeekList();
  }

  function selectWeek(dateStr) {
    const date = parseYMD(dateStr);
    selectedWeekStart = startOfWeek(date);
    if (date.getMonth() !== displayMonth || date.getFullYear() !== displayYear) {
      displayYear = date.getFullYear();
      displayMonth = date.getMonth();
    }
    renderAll();
  }

  calendarGrid.addEventListener('click', (e) => {
    const cell = e.target.closest('.day-cell');
    if (!cell) return;
    selectWeek(cell.dataset.date);
  });

  document.getElementById('prev-month').addEventListener('click', () => {
    displayMonth -= 1;
    if (displayMonth < 0) { displayMonth = 11; displayYear -= 1; }
    renderCalendar();
  });

  document.getElementById('next-month').addEventListener('click', () => {
    displayMonth += 1;
    if (displayMonth > 11) { displayMonth = 0; displayYear += 1; }
    renderCalendar();
  });

  document.getElementById('today-btn').addEventListener('click', () => {
    displayYear = today.getFullYear();
    displayMonth = today.getMonth();
    selectedWeekStart = startOfWeek(today);
    renderAll();
  });

  // ---- Project form ----
  function resetProjectForm() {
    projectForm.reset();
    document.getElementById('project-id').value = '';
    editingProjectId = null;
    projectFormTitle.textContent = 'プロジェクトを追加';
    projectSubmitBtn.textContent = 'プロジェクトを追加';
    projectCancelEditBtn.style.display = 'none';
  }

  function startEditProject(p) {
    editingProjectId = p.id;
    document.getElementById('project-id').value = p.id;
    document.getElementById('project-name').value = p.name;
    document.getElementById('project-due').value = p.dueDate || '';
    projectFormTitle.textContent = 'プロジェクトを編集';
    projectSubmitBtn.textContent = '更新';
    projectCancelEditBtn.style.display = 'inline-block';
    window.scrollTo({ top: projectForm.closest('.card').offsetTop - 10, behavior: 'smooth' });
  }

  projectForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('project-name').value.trim();
    const dueDate = document.getElementById('project-due').value;
    if (!name) return;

    projectSubmitBtn.disabled = true;
    try {
      if (editingProjectId) {
        const { error } = await sb.from('calendar_projects')
          .update({ name, due_date: dueDate || null })
          .eq('id', editingProjectId);
        if (error) throw error;
      } else {
        const { error } = await sb.from('calendar_projects')
          .insert({ id: uid(), name, due_date: dueDate || null });
        if (error) throw error;
      }
      resetProjectForm();
      projects = await fetchProjects();
      renderAll();
    } catch (err) {
      alert('保存に失敗しました: ' + err.message);
    } finally {
      projectSubmitBtn.disabled = false;
    }
  });

  projectCancelEditBtn.addEventListener('click', resetProjectForm);

  // ---- Task form ----
  function resetTaskForm() {
    taskForm.reset();
    document.getElementById('task-id').value = '';
    editingTaskRef = null;
    taskFormTitle.textContent = 'タスクを追加';
    submitBtn.textContent = '追加';
    cancelEditBtn.style.display = 'none';
    updateProjectSelectOptions();
  }

  function startEditTask(project, task) {
    editingTaskRef = { projectId: project.id, taskId: task.id };
    document.getElementById('task-id').value = task.id;
    taskProjectSelect.value = project.id;
    document.getElementById('task-name').value = task.name;
    document.getElementById('assignee').value = task.assignee;
    document.getElementById('due').value = task.due;
    document.getElementById('total-count').value = task.total;
    taskFormTitle.textContent = 'タスクを編集';
    submitBtn.textContent = '更新';
    cancelEditBtn.style.display = 'inline-block';
    window.scrollTo({ top: taskForm.closest('.card').offsetTop - 10, behavior: 'smooth' });
  }

  taskForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const projectId = taskProjectSelect.value;
    const name = document.getElementById('task-name').value.trim();
    const assignee = document.getElementById('assignee').value.trim();
    const due = document.getElementById('due').value;
    const totalCount = Math.max(1, parseInt(document.getElementById('total-count').value, 10) || 1);

    if (!projectId || !name || !assignee || !due) return;

    submitBtn.disabled = true;
    try {
      if (editingTaskRef) {
        const sourceProject = projects.find(p => p.id === editingTaskRef.projectId);
        const currentTask = sourceProject && sourceProject.tasks.find(t => t.id === editingTaskRef.taskId);
        let done = currentTask ? currentTask.done : 0;
        let status = currentTask ? currentTask.status : computeStatus(0, totalCount);
        if (!currentTask || currentTask.total !== totalCount) {
          done = Math.max(0, Math.min(done, totalCount));
          status = computeStatus(done, totalCount);
        }
        const { error } = await sb.from('calendar_tasks')
          .update({ project_id: projectId, name, assignee, due, total: totalCount, done, status })
          .eq('id', editingTaskRef.taskId);
        if (error) throw error;
      } else {
        const { error } = await sb.from('calendar_tasks').insert({
          id: uid(), project_id: projectId, name, assignee, due,
          total: totalCount, done: 0, status: computeStatus(0, totalCount)
        });
        if (error) throw error;
      }
      resetTaskForm();
      projects = await fetchProjects();
      renderAll();
    } catch (err) {
      alert('保存に失敗しました: ' + err.message);
    } finally {
      submitBtn.disabled = false;
    }
  });

  cancelEditBtn.addEventListener('click', resetTaskForm);

  // ---- Week list interactions (accordion + task actions) ----
  weekListEl.addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-action], .project-toggle[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;
    const projectId = btn.dataset.projectId;

    if (action === 'toggle-project') {
      projectOpenState[projectId] = !projectOpenState[projectId];
      renderWeekList();
      return;
    }

    if (action === 'edit-project') {
      const p = projects.find(p => p.id === projectId);
      if (p) startEditProject(p);
      return;
    }

    if (action === 'delete-project') {
      if (confirm('このプロジェクトを削除しますか?中のタスクもすべて削除されます。')) {
        const { error } = await sb.from('calendar_projects').delete().eq('id', projectId);
        if (error) { alert('削除に失敗しました: ' + error.message); return; }
        delete projectOpenState[projectId];
        projects = await fetchProjects();
        renderAll();
      }
      return;
    }

    const taskId = btn.dataset.taskId;
    const project = projects.find(p => p.id === projectId);
    if (!project) return;
    const task = project.tasks.find(t => t.id === taskId);
    if (!task) return;

    if (action === 'inc') {
      if (task.done >= task.total) return;
      const done = task.done + 1;
      const status = computeStatus(done, task.total);
      const { error } = await sb.from('calendar_tasks').update({ done, status }).eq('id', taskId);
      if (error) { alert('更新に失敗しました: ' + error.message); return; }
      projects = await fetchProjects();
      renderAll();
    } else if (action === 'dec') {
      if (task.done <= 0) return;
      const done = task.done - 1;
      const status = computeStatus(done, task.total);
      const { error } = await sb.from('calendar_tasks').update({ done, status }).eq('id', taskId);
      if (error) { alert('更新に失敗しました: ' + error.message); return; }
      projects = await fetchProjects();
      renderAll();
    } else if (action === 'delete-task') {
      if (confirm('このタスクを削除しますか?')) {
        const { error } = await sb.from('calendar_tasks').delete().eq('id', taskId);
        if (error) { alert('削除に失敗しました: ' + error.message); return; }
        projects = await fetchProjects();
        renderAll();
      }
    } else if (action === 'edit-task') {
      startEditTask(project, task);
    }
  });

  async function initApp() {
    const stored = getStoredPasscode();
    if (stored) {
      const ok = await verifyPasscode(stored);
      if (ok) {
        sb = createSupabaseClient(stored);
        passcodeOverlay.style.display = 'none';
        await boot();
        return;
      }
      clearStoredPasscode();
    }
    passcodeOverlay.style.display = 'flex';
    passcodeInput.focus();
  }

  passcodeForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const val = passcodeInput.value;
    if (!val) return;
    passcodeSubmitBtn.disabled = true;
    passcodeError.style.display = 'none';
    const ok = await verifyPasscode(val);
    passcodeSubmitBtn.disabled = false;
    if (ok) {
      storePasscode(val);
      sb = createSupabaseClient(val);
      passcodeOverlay.style.display = 'none';
      await boot();
    } else {
      passcodeError.style.display = 'block';
      passcodeInput.select();
    }
  });

  initApp();
</script>
</body>
</html>
